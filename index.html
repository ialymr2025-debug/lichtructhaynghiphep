    <!-- The heading font is served by this app (see src/index.css) instead of Google.

         preload is fetched a second time. -->

      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/be-vietnam-pro-900-vietnamese.woff2"
      crossorigin
    />
